# Lightweight Docker Compose for Local Development
# Only runs infrastructure services (db, redis, ngrok)
# App runs locally with: bun run dev

services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: roxas-db
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-postgres}
      - POSTGRES_DB=${DB_NAME:-roxas}
      - POSTGRES_HOST_AUTH_METHOD=trust
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for caching and queues
  redis:
    image: redis:7-alpine
    container_name: roxas-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Ngrok for webhook tunneling
  ngrok:
    image: ngrok/ngrok:alpine
    container_name: roxas-ngrok
    restart: unless-stopped
    command: [ "http", "host.docker.internal:3000", "--log=stdout" ]
    ports:
      - "4040:4040"
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}

volumes:
  postgres-data:
    name: roxas-postgres-data
  redis-data:
    name: roxas-redis-data
