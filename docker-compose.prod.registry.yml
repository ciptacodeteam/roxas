# Production Docker Compose - Uses Pre-built Images
# Images are built by GitHub Actions and pushed to ghcr.io
# This file pulls images instead of building (fast deployment!)

services:
  app:
    image: ghcr.io/${GITHUB_REPO:-yourusername/roxas}/app:main
    container_name: roxas-app-prod
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-}@redis:6379
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL}
      - NEXTAUTH_URL=${NEXTAUTH_URL}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - AUTH_SECRET=${AUTH_SECRET}
      - AUTH_URL=${AUTH_URL}
      - DIGIFLAZZ_USERNAME=${DIGIFLAZZ_USERNAME}
      - DIGIFLAZZ_API_KEY=${DIGIFLAZZ_API_KEY}
      - DIGIFLAZZ_API_URL=${DIGIFLAZZ_API_URL:-https://api.digiflazz.com/v1}
      - MIDTRANS_SERVER_KEY=${MIDTRANS_SERVER_KEY}
      - MIDTRANS_CLIENT_KEY=${MIDTRANS_CLIENT_KEY}
      - MIDTRANS_IS_PRODUCTION=${MIDTRANS_IS_PRODUCTION:-true}
      - MAILGUN_API_KEY=${MAILGUN_API_KEY}
      - MAILGUN_DOMAIN=${MAILGUN_DOMAIN}
      - MAILGUN_FROM_EMAIL=${MAILGUN_FROM_EMAIL}
      - MAILGUN_REGION=${MAILGUN_REGION:-eu}
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - roxas-network
    volumes:
      - uploads:/var/www/uploads
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  scheduler:
    image: ghcr.io/${GITHUB_REPO:-yourusername/roxas}/scheduler:main
    container_name: roxas-scheduler-prod
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL}
      - DIGIFLAZZ_USERNAME=${DIGIFLAZZ_USERNAME}
      - DIGIFLAZZ_API_KEY=${DIGIFLAZZ_API_KEY}
      - DIGIFLAZZ_API_URL=${DIGIFLAZZ_API_URL:-https://api.digiflazz.com/v1}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - roxas-network

  email-worker:
    image: ghcr.io/${GITHUB_REPO:-yourusername/roxas}/email-worker:main
    container_name: roxas-email-worker-prod
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - REDIS_URL=redis://:${REDIS_PASSWORD:-}@redis:6379
      - DATABASE_URL=${DATABASE_URL}
      - MAILGUN_API_KEY=${MAILGUN_API_KEY}
      - MAILGUN_DOMAIN=${MAILGUN_DOMAIN}
      - MAILGUN_FROM_EMAIL=${MAILGUN_FROM_EMAIL}
      - MAILGUN_REGION=${MAILGUN_REGION:-eu}
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    networks:
      - roxas-network

  db:
    image: postgres:15-alpine
    container_name: roxas-db-prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-roxas}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - roxas-network

  redis:
    image: redis:7-alpine
    container_name: roxas-redis-prod
    restart: unless-stopped
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-}
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-}", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - roxas-network

  nginx:
    image: nginx:alpine
    container_name: roxas-nginx-prod
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
      - uploads:/var/www/uploads:ro
    depends_on:
      - app
    networks:
      - roxas-network

  certbot:
    image: certbot/certbot
    container_name: roxas-certbot-prod
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

networks:
  roxas-network:
    driver: bridge

volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local
  uploads:
    driver: local
