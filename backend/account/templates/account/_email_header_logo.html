<tr>
  <td style="background: linear-gradient(135deg, #1B2129 0%, #2a3441 100%); padding: 30px 30px 10px 30px; text-align: center; border-bottom: 2px solid rgba(255, 255, 255, 0.1);">
    <!-- Brand Logo -->
    <div style="margin-bottom: 12px;">
      <img
        src="{{ FRONTEND_URL }}/img/logo.webp"
        alt="Roxas Store"
        width="160"
        height="40"
        style="display: block; margin: 0 auto; max-width: 100%; height: auto;"
      />
    </div>

    <!-- Fallback text title in case image is blocked -->
    <h1 style="margin: 0; color: #ffffff; font-size: 24px; font-weight: 700; letter-spacing: 1px;">
      ROXAS STORE
    </h1>
    {% if header_subtitle %}
      <p style="margin: 6px 0 0 0; color: #a0a0a0; font-size: 13px;">
        {{ header_subtitle }}
      </p>
    {% endif %}
  </td>
</tr>
